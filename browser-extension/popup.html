<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 344px;
      background: #141518;
      color: #EDEDEF;
      font-family: "MiSans", "Segoe UI", system-ui, sans-serif;
      padding: 15px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }
    .brand {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .status-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 12px;
      background: #191B1F;
      border: 1px solid rgba(255,255,255,0.08);
      color: #9A9CA6;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6B6E78;
    }
    .dot.ok { background: #22C55E; }
    .launch-mini {
      background: #22252C;
      color: #38BDF8;
      border: 1px solid rgba(56,189,248,0.35);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }
    .launch-mini:hover { background: #2A2E38; }
    .hidden { display: none !important; }
    .card {
      background: #191B1F;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 10px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 9px 0;
    }
    .sub {
      color: #6B6E78;
      font-size: 11px;
      margin-top: 4px;
      line-height: 1.45;
    }
    .sniff-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 10px 0;
    }
    .pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 5px;
      background: #141518;
      border: 1px solid rgba(255,255,255,0.07);
      color: #9A9CA6;
    }
    .pill.hls { color: #22C55E; border-color: rgba(34,197,94,0.28); }
    .pill.media { color: #38BDF8; border-color: rgba(56,189,248,0.28); }
    .pill.p2p { color: #F59E0B; border-color: rgba(245,158,11,0.28); }
    input[type="text"] {
      width: 100%;
      background: #141518;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 7px;
      padding: 7px 10px;
      color: #EDEDEF;
      font-size: 12px;
      outline: none;
      margin-bottom: 8px;
    }
    button.primary {
      width: 100%;
      background: #ECEDF0;
      color: #0F1012;
      border: none;
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary:hover { background: #FFFFFF; }
    button.accent {
      width: 100%;
      background: #38BDF8;
      color: #0B0D10;
      border: none;
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button.accent:hover { background: #56CBF9; }
    .res-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #EDEDEF;
      font-weight: 500;
    }
    .res-count {
      color: #38BDF8;
      font-family: Consolas, monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="brand">Siphon 下载捕获</span>
    <div class="status-group">
      <button id="launchBtn" class="launch-mini hidden">拉起客户端</button>
      <span class="badge"><span id="dot" class="dot"></span><span id="status">检测中</span></span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span>自动接管浏览器下载</span>
      <input id="toggle" type="checkbox" checked />
    </div>
    <div class="divider"></div>
    <div class="row">
      <span>启用网页资源嗅探（默认关闭）</span>
      <input id="sniffToggle" type="checkbox" />
    </div>
    <div class="sub">默认仅在下载时自动拉起客户端；手动启用嗅探后才会捕获流媒体并交由客户端弹窗管理</div>
  </div>

  <div class="card">
    <div class="res-header">
      <span>当前页资源嗅探（选择性下载窗）</span>
      <span id="resCount" class="res-count">未启用</span>
    </div>
    <div id="sniffSummary" class="sniff-summary"></div>
    <button id="openSniffBtn" class="accent">立即深度扫描并打开选择性下载窗</button>
  </div>

  <div class="card" style="margin-bottom: 0;">
    <input id="urlInput" type="text" placeholder="粘贴 http(s):// · .m3u8 · magnet:? · ed2k:// 链接" />
    <button id="sendBtn" class="primary">发送到 Siphon 捕获小窗</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
